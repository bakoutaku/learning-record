name: Build MiniRPG for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "java/practice/mini-rpg-window/src/**"
      - ".github/workflows/build-minirpg-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Build portable Windows app
        shell: pwsh
        run: |
          $sourcePath = "java/practice/mini-rpg-window/src/minirpg"

          New-Item -ItemType Directory -Force -Path "build/classes" | Out-Null
          New-Item -ItemType Directory -Force -Path "build/input" | Out-Null
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null

          $sources = Get-ChildItem "$sourcePath/*.java" | ForEach-Object { $_.FullName }
          javac -encoding UTF-8 -d build/classes $sources

          jar --create `
            --file build/input/MiniRPG.jar `
            --main-class minirpg.GameMain `
            -C build/classes .

          jpackage `
            --type app-image `
            --name MiniRPG `
            --input build/input `
            --main-jar MiniRPG.jar `
            --main-class minirpg.GameMain `
            --dest dist `
            --app-version 1.0.0 `
            --vendor bakoutaku `
            --description "Java Swing mini RPG"

          Compress-Archive `
            -Path "dist/MiniRPG" `
            -DestinationPath "dist/MiniRPG-Windows.zip" `
            -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: MiniRPG-Windows
          path: dist/MiniRPG-Windows.zip
          if-no-files-found: error
          retention-days: 30
